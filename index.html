        async function processOrder(name, finalPrice) {
            const discordTag = prompt("Please enter your Discord Username (e.g., AMA#0001):");
            if (!discordTag) return;

            const orderID = "ORD-" + Math.floor(Math.random() * 899999 + 100000);
            
            const payload = {
                embeds: [{
                    title: "🚀 New Web Order",
                    color: 3447003,
                    fields: [
                        { name: "Order ID", value: "`" + orderID + "`", inline: true },
                        { name: "Customer", value: discordTag, inline: true },
                        { name: "Script", value: name, inline: false },
                        { name: "Price Paid", value: "**$" + finalPrice + "**", inline: true }

                    footer: { text: "AMA Scripts System" },
                    timestamp: new Date()
                }]
            };

            try {
                await fetch(MY_WEBHOOK, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});

                window.open(MY_DISCORD, "_blank");
            } catch (e) { alert("Error sending order. Please contact us on Discord."); }
        }

            grid.innerHTML = '';
            
            const filtered = category === 'all' ? scripts : scripts.filter(s => s.cat === category);

            filtered.forEach(s => {
                const discountPrice = (s.price * 0.45).toFixed(2);

                                </div>
