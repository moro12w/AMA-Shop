<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMA Scripts | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #020617; color: white; font-family: 'Inter', sans-serif; }
        .card { background: #0f172a; border: 1px solid #1e293b; transition: 0.3s; }
        .card:hover { transform: translateY(-8px); border-color: #3b82f6; }
        .discount-label { background: linear-gradient(90deg, #ef4444, #f59e0b); }
    </style>
</head>
<body>

    <div class="bg-blue-600 text-center py-2 text-xs font-bold uppercase">
        🎁 GRAND OPENING: 55% OFF (APPLIED AUTOMATICALLY) 🎁
    </div>

    <nav class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-5 flex justify-between items-center px-10">
        <h1 class="text-3xl font-black text-blue-500">AMA <span class="text-white font-light">SCRIPTS</span></h1>
        <div class="hidden md:flex space-x-8 font-bold text-xs uppercase text-slate-400">
            <button onclick="filterScripts('all')" class="hover:text-white">All</button>
            <button onclick="filterScripts('jobs')" class="hover:text-white">Jobs</button>
            <button onclick="filterScripts('robbery')" class="hover:text-white">Robberies</button>
            <button onclick="filterScripts('ui')" class="hover:text-white">UI/UX</button>
        </div>
        <a id="discord-btn" href="https://discord.gg/YOUR_INVITE_HERE" target="_blank" class="bg-[#5865F2] px-6 py-2 rounded-lg font-bold text-sm hover:bg-[#4752c4] transition">
            <i class="fab fa-discord mr-2"></i> OPEN TICKET
        </a>
    </nav>

    <header class="py-20 text-center">
        <h2 class="text-6xl font-black mb-4 italic uppercase leading-none">Level Up <span class="text-blue-500">QB-Core</span></h2>
        <p class="text-slate-400 text-lg max-w-2xl mx-auto">Premium, optimized, and affordable FiveM scripts.</p>
    </header>

    <main class="container mx-auto px-10 pb-24">
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </main>

    <script>
        // 🔗 الروابط ديالك هنا
        const MY_WEBHOOK = "https://discord.com/api/webhooks/1466095709349482498/kzVUB-1jCqm0ApWTcvAMtkjuUVKmiyz5PMPXgYD1rq4OsinWLfRyaruyApk0JQUMVP6c";
        const MY_DISCORD = "https://discord.gg/7T5Nf2pU"; // 🔥 خاصك تبدل هاد الرابط برابط دعوتك الحقيقي

        document.getElementById('discord-btn').href = MY_DISCORD;

        const scripts = [
            { id: 1, name: "AMA Police MDT", price: "45.00", cat: "jobs", img: "p-mdt.png" },
            { id: 2, name: "AMA Pacific Bank", price: "60.00", cat: "robbery", img: "pacific.png" },
            { id: 3, name: "AMA Modern HUD", price: "20.00", cat: "ui", img: "hud.png" },
            { id: 4, name: "AMA Jewelry Heist", price: "35.00", cat: "robbery", img: "jewelry.png" },
            { id: 5, name: "AMA Mechanic Job", price: "40.00", cat: "jobs", img: "mechanic.png" },
            { id: 6, name: "AMA Inventory V2", price: "55.00", cat: "ui", img: "inv.png" },
            { id: 7, name: "AMA House Robbery", price: "25.00", cat: "robbery", img: "house.png" },
            { id: 8, name: "AMA Car Dealer", price: "50.00", cat: "jobs", img: "cardealer.png" }
            // تقدر تزيد الباقي هنا بنفس الطريقة...
        ];

        async function buyNow(name, finalPrice) {
            const user = prompt("Enter your Discord Name (e.g. User#0001):");
            if (!user) return;

            const payload = {
                embeds: [{
                    title: "🛒 New Purchase Request",
                    color: 3447003,
                    fields: [
                        { name: "Customer", value: user, inline: true },
                        { name: "Script", value: name, inline: true },
                        { name: "Price", value: "$" + finalPrice, inline: true }
                    ],
                    timestamp: new Date()
                }]
            };

            await fetch(MY_WEBHOOK, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
            alert("Order sent! Opening Discord...");
            window.open(MY_DISCORD, "_blank");
        }

        function filterScripts(category) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            const filtered = category === 'all' ? scripts : scripts.filter(s => s.cat === category);

            filtered.forEach(s => {
                const discount = (s.price * 0.45).toFixed(2);
                grid.innerHTML += `
                    <div class="card rounded-2xl overflow-hidden relative">
                        <div class="absolute top-4 left-4 discount-label text-[10px] font-black px-3 py-1 rounded-full z-10">-55% OFF</div>
                        <img src="${s.img}" class="w-full h-48 object-cover bg-slate-800" onerror="this.src='https://via.placeholder.com/400x200?text=AMA+SCRIPTS'">
                        <div class="p-6">
                            <h3 class="font-black text-xl italic">${s.name}</h3>
                            <div class="mt-6 flex justify-between items-end">
                                <div>
                                    <p class="text-xs text-slate-500 line-through">$${s.price}</p>
                                    <p class="text-2xl font-black text-green-400 leading-none">$${discount}</p>
                                </div>
                                <button onclick="buyNow('${s.name}', '${discount}')" class="bg-white text-black px-4 py-2 rounded-xl font-black text-xs hover:bg-blue-500 hover:text-white transition">BUY NOW</button>
                            </div>
                        </div>
                    </div>`;
            });
        }
        filterScripts('all');
    </script>
</body>
</html>
