<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMA Scripts | المتجر النخبة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Noto+Sans+Arabic:wght@400;700;900&display=swap');
        
        body { background-color: #020617; color: white; font-family: 'Noto Sans Arabic', sans-serif; overflow: hidden; }
        .font-header { font-family: 'Orbitron', sans-serif; }
        
        #auth-screen, #success-screen { 
            position: fixed; inset: 0; background: #020617; z-index: 9999; 
            display: flex; align-items: center; justify-content: center; 
        }
        #success-screen { display: none; background: rgba(2, 6, 23, 0.98); }

        .custom-card { 
            background: #0f172a; border: 1px solid #1e293b; 
            padding: 3rem; border-radius: 2.5rem; width: 95%; max-width: 450px; text-align: center;
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.1);
        }

        #store-content { display: none; height: 100vh; overflow-y: auto; }
        .card { background: #0f172a; border: 1px solid #1e293b; transition: 0.4s; }
        .card:hover { transform: translateY(-10px); border-color: #3b82f6; box-shadow: 0 0 30px rgba(59, 130, 246, 0.2); }
        
        input { background: rgba(2, 6, 23, 0.6) !important; border: 1px solid #1e293b !important; color: white !important; text-align: center; }
        .btn-glow { background: #2563eb; transition: 0.3s; }
        .btn-glow:hover { background: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        
        .discord-nav-btn {
            background: #5865F2;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .discord-nav-btn:hover { background: #4752c4; transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="custom-card">
            <h2 class="text-3xl font-header font-black italic text-white mb-6 uppercase tracking-tighter">التحقق من <span class="text-blue-500">الهوية</span></h2>
            <div class="space-y-4 text-right">
                <div>
                    <label class="text-[12px] font-bold text-slate-500 mb-2 block mr-2">الاسم الكامل</label>
                    <input type="text" id="auth_name" class="w-full p-4 rounded-2xl outline-none" placeholder="أدخل اسمك هنا">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[12px] font-bold text-slate-500 mb-2 block mr-2">العمر</label>
                        <input type="number" id="auth_age" class="w-full p-4 rounded-2xl outline-none" placeholder="عمرك">
                    </div>
                    <div>
                        <label class="text-[12px] font-bold text-slate-500 mb-2 block mr-2">ديسكورد</label>
                        <input type="text" id="auth_discord" class="w-full p-4 rounded-2xl outline-none" placeholder="User#0000">
                    </div>
                </div>
                <button onclick="login()" class="w-full btn-glow py-5 rounded-2xl font-black uppercase text-sm tracking-widest mt-4">دخول المتجر</button>
            </div>
        </div>
    </div>

    <div id="success-screen">
        <div class="custom-card border-blue-500/30">
            <div class="w-20 h-20 bg-blue-500/10 text-blue-500 rounded-full mx-auto flex items-center justify-center mb-6 border border-blue-500/30">
                <i class="fas fa-receipt text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">تم تسجيل طلبك!</h2>
            <p class="text-slate-400 text-sm mb-4">يرجى حفظ رقم الطلب وتزويدنا به في الديسكورد:</p>
            
            <div class="bg-blue-600/20 border border-blue-500/50 p-4 rounded-2xl mb-8">
                <span class="text-[10px] text-blue-400 block uppercase mb-1">رقم الطلب الخاص بك</span>
                <span id="order-id-display" class="text-3xl font-header font-black tracking-widest text-white">#0000</span>
            </div>

            <a href="https://discord.gg/73emSMfn" target="_blank" class="block w-full bg-[#5865F2] py-5 rounded-2xl font-black text-sm tracking-widest transition shadow-lg">
                <i class="fab fa-discord ml-2 text-lg"></i> فتح تذكرة الآن
            </a>
            <button onclick="closeSuccess()" class="mt-6 text-slate-600 hover:text-white text-xs font-bold tracking-widest">إغلاق</button>
        </div>
    </div>

    <div id="store-content">
        <nav class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-6 px-10 flex justify-between items-center flex-row-reverse">
            <h1 class="text-2xl font-header font-black italic">AMA <span class="text-blue-600">SCRIPTS</span></h1>
            
            <a href="https://discord.gg/73emSMfn" target="_blank" class="discord-nav-btn shadow-lg shadow-blue-500/20">
                <i class="fab fa-discord text-base"></i>
                <span>خادم الديسكورد</span>
            </a>
        </nav>

        <header class="py-20 text-center">
            <h2 class="text-6xl md:text-8xl font-header font-black mb-4 italic tracking-tighter uppercase">THE <span class="text-blue-600 italic">COLLECTION</span></h2>
            <p class="text-slate-500 text-xs font-bold tracking-[0.6em] uppercase">نخبة برمجيات QB-CORE</p>
        </header>

        <main class="container mx-auto px-8 pb-32">
            <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10"></div>
        </main>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1466095709349482498/kzVUB-1jCqm0ApWTcvAMtkjuUVKmiyz5PMPXgYD1rq4OsinWLfRyaruyApk0JQUMVP6c";
        const ADMIN_ROLE = "1438109046992408697";

        let user = { name: "", age: "", discord: "" };

        function login() {
            const n = document.getElementById('auth_name').value;
            const a = document.getElementById('auth_age').value;
            const d = document.getElementById('auth_discord').value;
            if(!n || !a || !d) return alert("يرجى ملء كافة البيانات!");
            user = { name: n, age: a, discord: d };
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('store-content').style.display = 'block';
            document.body.style.overflow = 'auto';
        }

        async function processOrder(scriptName, price, img) {
            const orderId = "AMA-" + Math.floor(1000 + Math.random() * 9000);
            const payload = {
                content: `<@&${ADMIN_ROLE}> 🚨 **طلب جديد!**`,
                embeds: [{
                    title: "📥 تفاصيل الطلب",
                    color: 3066993,
                    thumbnail: { url: `https://moro12w.github.io/AMA-Shop/${img}` },
                    fields: [
                        { name: "رقم الطلب", value: "```" + orderId + "```", inline: false },
                        { name: "المنتج", value: "```" + scriptName + "```", inline: true },
                        { name: "السعر", value: "```$" + price + "```", inline: true },
                        { name: "العميل", value: `**الاسم:** ${user.name}\n**ديسكورد:** ${user.discord}`, inline: false }
                    ],
                    timestamp: new Date()
                }]
            };

            await fetch(WEBHOOK_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
            document.getElementById('order-id-display').innerText = "#" + orderId;
            document.getElementById('success-screen').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeSuccess() {
            document.getElementById('success-screen').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // قائمة السكريبتات (يمكنك إضافة الـ 25 كاملة هنا)
        const scripts = [
            { name: "نظام الشرطة المتطور", price: "45.00", bio: "نظام قاعدة بيانات شامل للشرطة.", img: "p-mdt.png" },
            { name: "سطو بنك الباسيفيك", price: "60.00", bio: "عملية سطو متعددة المراحل باحترافية.", img: "pacific.png" },
            { name: "واجهة المستخدم الحديثة", price: "20.00", bio: "واجهة أنيقة لعرض الحالة والسيارات.", img: "hud.png" },
            { name: "سطو محلات المجوهرات", price: "35.00", bio: "نظام سطو متزامن مع حماية متطورة.", img: "jewelry.png" },
            { name: "نظام الميكانيكي الشامل", price: "40.00", bio: "قائمة تعديل وتصليح كاملة.", img: "mechanic.png" },
            { name: "نظام الحقيبة V2", price: "55.00", bio: "حقيبة بنظام Metadata وسحب وإفلات.", img: "inv.png" },
            { name: "معرض السيارات الخاص", price: "50.00", bio: "إمكانية تملك معارض السيارات وبيعها.", img: "cardealer.png" },
            { name: "نظام غسيل الأموال", price: "25.00", bio: "طرق سرية لغسل الأموال المكتسبة.", img: "money.png" }
        ];

        function render() {
            const grid = document.getElementById('grid');
            scripts.forEach(s => {
                const final = (s.price * 0.45).toFixed(2);
                grid.innerHTML += `
                    <div class="card rounded-[2.5rem] overflow-hidden flex flex-col h-full text-right">
                        <img src="${s.img}" class="w-full h-48 object-cover bg-slate-800" onerror="this.src='https://via.placeholder.com/400x200?text=${s.name}'">
                        <div class="p-8 flex flex-col flex-grow">
                            <h3 class="text-xl font-bold italic uppercase tracking-tighter">${s.name}</h3>
                            <p class="text-slate-500 text-sm mt-3 flex-grow italic leading-relaxed">${s.bio}</p>
                            <div class="mt-8 flex justify-between items-center bg-slate-900 p-5 rounded-3xl flex-row-reverse">
                                <p class="text-2xl font-header font-black text-blue-500 italic">$${final}</p>
                                <button onclick="processOrder('${s.name}', '${final}', '${s.img}')" class="bg-white text-black hover:bg-blue-600 hover:text-white px-6 py-3 rounded-2xl font-black text-xs uppercase transition-all shadow-xl">اطلب الآن</button>
                            </div>
                        </div>
                    </div>`;
            });
        }
        render();
    </script>
</body>
</html>
